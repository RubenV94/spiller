<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2f36"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee8b0"/>
      <stop offset="100%" stop-color="#4fb8e8"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- The Plane: a rounded card floating above -->
