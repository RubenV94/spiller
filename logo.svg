  <circle cx="120" cy="88" r="16" fill="url(#accent)"/>
  <rect x="80" y="114" width="80" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>

  <!-- The Dock: the pill sitting below -->
  <rect x="70" y="168" width="100" height="30" rx="15"
        fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <circle cx="92" cy="183" r="7" fill="url(#accent)"/>
  <rect x="108" y="179" width="46" height="8" rx="4" fill="rgba(255,255,255,0.45)"/>
</svg>
